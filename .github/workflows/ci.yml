# Quality pipeline (docs/qaops/PLANO.md). Each gate is its own job so the
# PR checks show exactly which gate failed; the "Quality gates" job writes
# the approved/rejected table to the run summary.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Explicit bash runs steps with -eo pipefail, so `command | tee log` fails
# when the command fails (the default `bash -e` keeps only tee's status).
defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: G1 Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies (composer install)
        uses: ./.github/actions/setup-php-app

      - name: Boot Laravel and load all routes
        run: |
          if ! php artisan route:list --ansi 2>&1 | tee ci-out/route-list.log; then
            echo "::error title=G1 Build::Laravel failed to boot (php artisan route:list). See the step log or the g1-build-logs artifact."
            exit 1
          fi

      - name: Job summary
        if: always()
        run: |
          {
            echo "### G1 Build"
            echo "- composer install: ${{ job.status == 'success' && 'ok' || 'see log' }}"
            echo "- Routes loaded: $(grep -cE '^\s+(GET|POST|PUT|PATCH|DELETE|ANY)' ci-out/route-list.log 2>/dev/null || echo 0)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: g1-build-logs
          path: ci-out/
          if-no-files-found: ignore

  static-analysis:
    name: G2 Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-php-app

      - name: Code style (Pint --test)
        id: pint
        continue-on-error: true
        run: vendor/bin/pint --test -v 2>&1 | tee ci-out/pint.log

      - name: Larastan (level 5)
        id: larastan
        continue-on-error: true
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G --error-format=table 2>&1 | tee ci-out/larastan.log

      - name: Annotate Larastan errors
        if: steps.larastan.outcome == 'failure'
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G --error-format=github || true

      - name: Gate decision
        run: |
          pint="${{ steps.pint.outcome }}"; larastan="${{ steps.larastan.outcome }}"
          {
            echo "### G2 Static analysis"
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Pint (code style) | $([ "$pint" = success ] && echo '✅ no differences' || echo '❌ files out of style') |"
            echo "| Larastan level 5 | $([ "$larastan" = success ] && echo '✅ no errors' || echo '❌ errors found') |"
          } >> "$GITHUB_STEP_SUMMARY"
          fail=0
          if [ "$pint" != success ]; then
            echo "::error title=G2 Pint::Code style differs from Laravel Pint. Run 'vendor/bin/pint' locally and commit. Files listed in the 'Code style' step."
            fail=1
          fi
          if [ "$larastan" != success ]; then
            echo "::error title=G2 Larastan::Larastan found errors (level 5, baseline is empty). See the 'Larastan' step or the annotations on the changed files."
            fail=1
          fi
          exit $fail

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: g2-static-analysis-logs
          path: ci-out/
          if-no-files-found: ignore

  tests:
    name: G3 Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-php-app
        with:
          coverage: pcov

      # Coverage is measured in the same run (PCOV, scope = <source> in
      # phpunit.xml, app/Services). The G4 job reads reports/clover.xml.
      - name: Run tests (PHPUnit, SQLite in memory, PCOV coverage)
        id: phpunit
        continue-on-error: true
        run: |
          mkdir -p reports
          php artisan test --log-junit reports/junit.xml \
            --coverage-clover reports/clover.xml \
            --coverage-html reports/coverage-html 2>&1 | tee ci-out/phpunit.log

      - name: Gate decision
        run: |
          python3 - <<'PY'
          import os, sys, xml.etree.ElementTree as ET
          out = open(os.environ["GITHUB_STEP_SUMMARY"], "a")
          out.write("### G3 Tests\n")
          try:
              root = ET.parse("reports/junit.xml").getroot()
          except Exception as e:
              print(f"::error title=G3 Tests::No JUnit report produced ({e}). The test run crashed before finishing; see the 'Run tests' step.")
              out.write("❌ No JUnit report: the test run crashed.\n")
              sys.exit(1)
          suite = root if root.tag == "testsuite" else root.find("testsuite")
          tests, fails, errs, skips = (int(suite.get(k, 0)) for k in ("tests", "failures", "errors", "skipped"))
          time = float(suite.get("time", 0))
          out.write("| Tests | Passed | Failed | Errors | Skipped | Time |\n|---|---|---|---|---|---|\n")
          out.write(f"| {tests} | {tests - fails - errs - skips} | {fails} | {errs} | {skips} | {time:.1f}s |\n")
          broken = []
          for case in root.iter("testcase"):
              problem = case.find("failure")
              if problem is None:
                  problem = case.find("error")
              if problem is not None:
                  name = f"{case.get('class')}::{case.get('name')}"
                  msg = (problem.text or problem.get("message") or "").strip().splitlines()
                  first = msg[0] if msg else "failed"
                  broken.append(name)
                  path = os.path.relpath(case.get("file") or ".", os.environ.get("GITHUB_WORKSPACE", os.getcwd()))
                  print(f"::error file={path},line={case.get('line','1')},title=G3 failed test::{name}: {first}")
          if broken:
              out.write("\nFailed tests:\n" + "".join(f"- `{b}`\n" for b in broken))
          if fails or errs or tests == 0 or "${{ steps.phpunit.outcome }}" != "success":
              print(f"::error title=G3 Tests::{fails + errs} of {tests} tests failed. Details in the 'Run tests' step and the g3-tests-junit artifact.")
              sys.exit(1)
          PY

      - name: Upload JUnit report and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: g3-tests-junit
          path: |
            reports/junit.xml
            ci-out/
          if-no-files-found: ignore

      - name: Upload coverage report (HTML + Clover)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: g4-coverage-report
          path: |
            reports/clover.xml
            reports/coverage-html/
          if-no-files-found: ignore

  coverage:
    name: G4 Coverage
    needs: tests
    # Runs even when a test failed: coverage is a separate gate with its own verdict.
    if: always() && needs.tests.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: g4-coverage-report
          path: reports

      # Thresholds and their justification: docs/qaops/gates.md (G4).
      - name: Gate decision (line coverage per file in app/Services)
        run: |
          python3 - <<'PY'
          import os, sys, xml.etree.ElementTree as ET
          BLOCK = {
              "TestimonialService.php": 90,  # R1, R3 (used by the E4 experiment)
              "NewsService.php": 80,         # R4
              "PartnerService.php": 80,      # outside R1-R4, covered in E5
              "UserService.php": 100,        # outside R1-R4, covered in E5
          }
          TOTAL = 85                         # floor for all of app/Services
          out = open(os.environ["GITHUB_STEP_SUMMARY"], "a")
          out.write("### G4 Coverage (lines, app/Services)\n")
          try:
              root = ET.parse("reports/clover.xml").getroot()
          except Exception as e:
              print(f"::error title=G4 Coverage::No coverage report ({e}). The test run crashed before finishing; see the G3 Tests job.")
              out.write("❌ No coverage report: the test run crashed.\n")
              sys.exit(1)
          pct = lambda c, s: 100.0 * c / s if s else 100.0
          out.write("| File | Lines | Coverage | Rule | Result |\n|---|---|---|---|---|\n")
          fail, cov_all, stm_all = [], 0, 0
          for f in sorted(root.iter("file"), key=lambda f: f.get("name")):
              m = f.find("metrics")
              name = os.path.basename(f.get("name"))
              stm, cov = int(m.get("statements")), int(m.get("coveredstatements"))
              cov_all += cov; stm_all += stm
              p = pct(cov, stm)
              if name in BLOCK:
                  ok = p >= BLOCK[name]
                  rule, res = f"≥ {BLOCK[name]}% (blocks)", "✅" if ok else "❌"
                  if not ok:
                      fail.append(name)
                      print(f"::error title=G4 Coverage ({name})::{p:.1f}% of lines covered, minimum is {BLOCK[name]}%. Add tests for the new or changed code in {name}.")
              else:
                  rule, res = "report only", "⚠️ below the total floor" if p < TOTAL else "ℹ️"
                  if p < TOTAL:
                      print(f"::warning title=G4 Coverage ({name})::{p:.1f}% of lines covered (not blocking: no per-file limit yet, only the total). Add the file to BLOCK in ci.yml with its measured coverage.")
              out.write(f"| `{name}` | {cov}/{stm} | {p:.1f}% | {rule} | {res} |\n")
          total = pct(cov_all, stm_all)
          ok = total >= TOTAL
          out.write(f"| **Total** | {cov_all}/{stm_all} | **{total:.1f}%** | ≥ {TOTAL}% (blocks) | {'✅' if ok else '❌'} |\n")
          out.write("\nFull report: artifact `g4-coverage-report` (open `coverage-html/index.html`).\n")
          if not ok:
              fail.append("total")
              print(f"::error title=G4 Coverage (total)::{total:.1f}% of lines covered in app/Services, minimum is {TOTAL}%.")
          if fail:
              sys.exit(1)
          PY

  dependencies:
    name: G5 Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-php-app
        with:
          install: "false"

      - name: composer audit (composer.lock)
        run: |
          mkdir -p ci-out
          composer audit --locked --abandoned=ignore 2>&1 | tee ci-out/composer-audit.log || true
          composer audit --locked --abandoned=ignore --format=json > ci-out/composer-audit.json || true

      - name: Gate decision (block on critical)
        run: |
          f=ci-out/composer-audit.json
          if ! jq -e '.advisories' "$f" > /dev/null 2>&1; then
            echo "::error title=G5 Dependencies::composer audit did not produce a report. See the 'composer audit' step."
            exit 1
          fi
          # $p is a jq variable, not a shell one
          # shellcheck disable=SC2016
          adv='[.advisories | to_entries[] | .key as $p | .value[] | {pkg: $p, sev: (.severity // "unknown"), cve: (.cve // .advisoryId), title, link}]'
          count() { jq "$adv | map(select(.sev == \"$1\")) | length" "$f"; }
          crit=$(count critical); high=$(count high); med=$(count medium); low=$(count low)
          {
            echo "### G5 Dependencies"
            echo "| Critical | High | Medium | Low |"
            echo "|---|---|---|---|"
            echo "| $crit | $high | $med | $low |"
            echo
            echo "Rule: block on **critical**; high is reported as a warning."
            jq -r "$adv | map(select(.sev == \"critical\" or .sev == \"high\")) | .[] | \"- **\(.sev)** \`\(.pkg)\` \(.cve): \(.title)\"" "$f"
          } >> "$GITHUB_STEP_SUMMARY"
          jq -r "$adv | map(select(.sev == \"high\")) | .[] | \"::warning title=G5 high (\(.pkg))::\(.cve): \(.title)\"" "$f"
          if [ "$crit" -gt 0 ]; then
            jq -r "$adv | map(select(.sev == \"critical\")) | .[] | \"::error title=G5 critical vulnerability (\(.pkg))::\(.cve): \(.title) \(.link)\"" "$f"
            echo "::error title=G5 Dependencies::$crit critical vulnerability(ies) in composer.lock. Update the affected package(s) within the same major and run the tests."
            exit 1
          fi

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: g5-dependencies-audit
          path: ci-out/
          if-no-files-found: ignore

  secrets:
    name: G6 Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # whole history, not only the last commit

      - name: Gitleaks (all commits)
        id: gitleaks
        continue-on-error: true
        run: |
          mkdir -p ci-out
          docker run --rm -v "$PWD":/repo:ro -v "$PWD/ci-out":/out ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --no-banner --exit-code 1 \
            --report-format json --report-path /out/gitleaks.json 2>&1 | tee ci-out/gitleaks.log

      - name: Gate decision
        run: |
          f=ci-out/gitleaks.json
          {
            echo "### G6 Secrets"
            echo "$(grep -oE '[0-9]+ commits scanned' ci-out/gitleaks.log || echo 'commits scanned: unknown') (whole history, Gitleaks v8.30.1, values redacted)"
          } >> "$GITHUB_STEP_SUMMARY"
          if ! jq -e 'type == "array"' "$f" > /dev/null 2>&1; then
            echo "::error title=G6 Secrets::Gitleaks did not produce a report. See the 'Gitleaks' step."
            echo "❌ No Gitleaks report." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          n=$(jq length "$f")
          if [ "$n" -eq 0 ] && [ "${{ steps.gitleaks.outcome }}" = success ]; then
            echo "✅ No secrets found." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "❌ $n finding(s):"
            echo "| Rule | File | Line | Commit |"
            echo "|---|---|---|---|"
            jq -r '.[] | "| \(.RuleID) | `\(.File)` | \(.StartLine) | \(.Commit[0:7]) |"' "$f"
          } >> "$GITHUB_STEP_SUMMARY"
          jq -r '.[] | "::error file=\(.File),line=\(.StartLine),title=G6 secret (\(.RuleID))::Possible secret in commit \(.Commit[0:7]). Revoke it, remove it from history, or mark a false positive in .gitleaksignore."' "$f"
          echo "::error title=G6 Secrets::$n possible secret(s) in the git history. Merge into main is blocked."
          exit 1

      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: g6-secrets-report
          path: ci-out/
          if-no-files-found: ignore

  gates:
    name: Quality gates
    if: always()
    needs: [build, static-analysis, tests, coverage, dependencies, secrets]
    runs-on: ubuntu-latest
    steps:
      - name: Gate table
        run: |
          verdict() { case "$1" in success) echo "✅ aprovado";; failure) echo "❌ reprovado";; cancelled) echo "⚪ cancelado";; *) echo "⚪ $1";; esac; }
          {
            echo "## Quality gates"
            echo "| Gate | Critério | Resultado |"
            echo "|---|---|---|"
            echo "| G1 Build | composer install e o Laravel sobe (route:list) | $(verdict '${{ needs.build.result }}') |"
            echo "| G2 Análise estática | Pint sem diferença, Larastan nível 5 sem erro | $(verdict '${{ needs.static-analysis.result }}') |"
            echo "| G3 Testes | 100% dos testes passando | $(verdict '${{ needs.tests.result }}') |"
            echo "| G4 Cobertura | linhas em app/Services: Testimonial ≥ 90%, News ≥ 80%, Partner ≥ 80%, User = 100%, total ≥ 85% | $(verdict '${{ needs.coverage.result }}') |"
            echo "| G5 Dependências | nenhuma vulnerabilidade crítica | $(verdict '${{ needs.dependencies.result }}') |"
            echo "| G6 Segredos | Gitleaks sem achados no histórico todo | $(verdict '${{ needs.secrets.result }}') |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Decision
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error title=Quality gates::At least one gate failed. Merge into main is blocked. See the table in the run summary."
          exit 1
